server:
  port: 8081
spring:
  application:
    name: ai-gateway
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:localhost}:3306/comment_hub?useSSL=false&allowPublicKeyRetrieval=true&connectionTimeZone=UTC
    username: ${MYSQL_USER:root}
    password: ${MYSQL_PASSWORD:root}
    hikari:
      maximum-pool-size: 10
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: 6379
      timeout: 500ms

hub:
  grpc:
    port: 9090
  llm:
    provider: ${LLM_PROVIDER:mock}
    base-url: ${LLM_BASE_URL:http://localhost:8000}
    api-key: ${LLM_API_KEY:}
    model: ${LLM_MODEL:mock-chat}
    disable-thinking: ${LLM_DISABLE_THINKING:false}
    # 单价：元 / 百万 token。mock 记 0；真模型请按官网当前价格填写（见 docs/cost.md）
    price-input-per-m: ${LLM_PRICE_INPUT:0}
    price-cache-hit-per-m: ${LLM_PRICE_CACHE_HIT:0}
    price-output-per-m: ${LLM_PRICE_OUTPUT:0}
  limit:
    qps: 50                    # 每秒请求令牌
    burst: 100
    tokens-per-minute: 200000  # 每分钟 token 预算
  breaker:
    failure-rate: 50
    slow-rate: 50
    slow-ms: 2000
    open-ms: 10000

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus,metrics
  metrics:
    distribution:
      percentiles-histogram:
        hikaricp.connections.acquire: true
    tags:
      application: ai-gateway

logging:
  pattern:
    console: "%d{HH:mm:ss.SSS} %-5level [%X{traceId:-}] [%thread] %logger{20} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%X{traceId:-}] [%thread] %logger{20} - %msg%n"
