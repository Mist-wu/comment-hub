server:
  port: 8000
spring:
  application:
    name: mock-llm
  threads:
    virtual:
      enabled: true   # 注入 10 秒延迟时每个请求都在 sleep，用虚拟线程撑住并发
management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
  metrics:
    tags:
      application: mock-llm

logging:
  pattern:
    console: "%d{HH:mm:ss.SSS} %-5level [%X{traceId:-}] [%thread] %logger{20} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%X{traceId:-}] [%thread] %logger{20} - %msg%n"
