global:
  scrape_interval: 5s
  evaluation_interval: 5s
scrape_configs:
  - job_name: spring
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["comment-service:8080", "ai-gateway:8081", "consumer:8082", "mock-llm:8000"]
  - job_name: mysql
    static_configs: [{ targets: ["mysqld-exporter:9104"] }]
  - job_name: redis
    static_configs: [{ targets: ["redis-exporter:9121"] }]
  - job_name: kafka
    static_configs: [{ targets: ["kafka-exporter:9308"] }]
